name: build

# Тест-контур собирается из main; префикс test- отделяет его образы от других контуров.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          docker build --tag "ghcr.io/${{ github.repository }}:test-${{ github.sha }}" .
          docker push "ghcr.io/${{ github.repository }}:test-${{ github.sha }}"
