name: build

# main -> test-<sha>, тег v* -> prod-<tag>.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="prod-${GITHUB_REF#refs/tags/}"
          else
            tag="test-${GITHUB_SHA}"
          fi
          docker build --tag "ghcr.io/${{ github.repository }}:$tag" .
          docker push "ghcr.io/${{ github.repository }}:$tag"
